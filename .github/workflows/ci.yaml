# This is a Github Workflow that runs tests on any push or pull request.
# If the tests pass and this is a push to the master branch it also runs Semantic Release.
# NB: npm trusted publishing (OIDC) is bound to this exact filename — `ci.yaml`.
name: CI
on: [push, pull_request]

permissions: {}

jobs:
  test_push:
    name: Test on push
    if: github.event_name == 'push'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests
        timeout-minutes: 5
        run: yarn test

      - name: Upload coverage to Qlty
        if: github.ref == 'refs/heads/master'
        uses: qltysh/qlty-action/coverage@a46e29cfd54065ae8a2c6b1fd3446aed1b1a4257 # v2.8.0
        with:
          token: ${{ secrets.QLTY_TOKEN }}
          files: target/coverage/lcov.info

  test_pr:
    if: github.event_name == 'pull_request'
    name: Test PR (Node v${{ matrix.node-version }}, OS ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-26.04 ]
        node-version: [ 22, 24, 26 ]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Run tests
        timeout-minutes: 5
        run: yarn test

  release:
    name: Release
    # https://github.community/t/trigger-job-on-tag-push-only/18076
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test_push
    environment: gh-cicd
    runs-on: ubuntu-26.04
    permissions:
      checks: read
      statuses: write
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Fetch deps
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Semantic Release
        env:
          GIT_COMMITTER_NAME: ${{ vars.GIT_COMMITTER_NAME }}
          GIT_COMMITTER_EMAIL: ${{ vars.GIT_COMMITTER_EMAIL }}
          GIT_SIGN_KEY: ${{ secrets.GIT_SIGN_KEY }}
          GH_USER: x-access-token
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_OIDC: true
          NPM_PROVENANCE: true
        run: npm_config_yes=true npx zx-semrel
